name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        run: |
          git remote add hf https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ vars.HF_SPACE_NAME }}
          git lfs push --all hf
          git push hf HEAD:main --force

  build:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg GIT_REMOTE_URL=https://huggingface.co/spaces/${{ vars.HF_SPACE_NAME }}.git \
            -t ${{ vars.HF_SPACE_NAME }} .
          docker login -u ${{ secrets.HF_USER }} -p ${{ secrets.HF_TOKEN }} registry.huggingface.co
          docker tag ${{ vars.HF_SPACE_NAME }} registry.huggingface.co/${{ vars.HF_SPACE_NAME }}:latest
          docker push registry.huggingface.co/${{ vars.HF_SPACE_NAME }}:latest
